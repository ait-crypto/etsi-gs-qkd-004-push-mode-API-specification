name: Generate OpenAPI Docs

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Redocly CLI and OpenAPI-to-PDF CLI
      - name: Install CLI tools
        run: npm install -g @redocly/cli @svengroup/openapi-to-pdf

      # Generate HTML for both specs
      - name: Generate HTML
        run: |
          redocly build-docs etsi_004_push_mode_kms_server.yaml -o docs/kms.html
          redocly build-docs etsi_004_push_mode_qkd_server.yaml -o docs/qkd.html

      # Generate PDF for both specs using openapi-to-pdf
      - name: Generate PDF
        run: |
          openapi-to-pdf etsi_004_push_mode_kms_server.yaml --output docs/kms.pdf
          openapi-to-pdf etsi_004_push_mode_qkd_server.yaml --output docs/qkd.pdf

      # Commit generated files back to the repository (optional)
      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Auto-generate OpenAPI docs" || true
          git push

      # Deploy docs to GitHub Pages for main and development branches
      - name: Deploy to GitHub Pages
        # if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ github.ref_name }}
