name: Generate OpenAPI Docs

on:
  push:
    branches:
        - development
        - main
    tags:
      - '*'           # run on any tag
    paths:
      - etsi_004_push_mode_kms_server.yaml
      - etsi_004_push_mode_qkd_server.yaml
      - docs/rapipdf_config.json
      - .github/workflows/openapi-docs.yml
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install converters
        run: npm install -g @redocly/cli @kingjan1999/rapipdf-cli

      - name: Generate HTML
        run: |
          mkdir -p docs
          redocly build-docs etsi_004_push_mode_kms_server.yaml -o docs/kms.html
          redocly build-docs etsi_004_push_mode_qkd_server.yaml -o docs/qkd.html

      - name: Generate PDFs
        run: |
          rapipdf etsi_004_push_mode_kms_server.yaml -o docs/kms.pdf -c docs/rapipdf_config.json
          rapipdf etsi_004_push_mode_qkd_server.yaml -o docs/qkd.pdf -c docs/rapipdf_config.json

      - name: Compute deploy path
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "DEPLOY_PATH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.DEPLOY_PATH }}

      - name: Print URLs
        run: |
          REPO=${GITHUB_REPOSITORY#*/}
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO/${DEPLOY_PATH}"
          echo "$BASE/kms.html"
          echo "$BASE/qkd.html"
          echo "$BASE/kms.pdf"
          echo "$BASE/qkd.pdf"
