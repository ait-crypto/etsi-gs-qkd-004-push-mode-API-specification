name: Generate OpenAPI Docs

on:
  push:
    branches: ['**']
    tags: ['*']
    paths:
      - etsi_004_push_mode_kms_server.yaml
      - etsi_004_push_mode_qkd_server.yaml
      - docs/rapipdf_config.json
      - .github/workflows/openapi-docs.yml
  workflow_dispatch:

jobs:
  html-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly
        run: npm install -g @redocly/cli

      - name: Generate HTML
        run: |
          mkdir -p docs
          redocly build-docs etsi_004_push_mode_kms_server.yaml -o docs/kms.html
          redocly build-docs etsi_004_push_mode_qkd_server.yaml -o docs/qkd.html

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/*.html

  pdf-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rapipdf CLI
        run: npm install -g @kingjan1999/rapipdf-cli

      - name: Generate PDFs
        run: |
          mkdir -p docs
          rapipdf etsi_004_push_mode_kms_server.yaml -o docs/kms.pdf -c docs/rapipdf_config.json
          rapipdf etsi_004_push_mode_qkd_server.yaml -o docs/qkd.pdf -c docs/rapipdf_config.json

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: docs/*.pdf

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [html-docs, pdf-docs]

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: docs

      - name: Compute deploy path
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "DEPLOY_PATH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.DEPLOY_PATH }}

      - name: Print URLs
        run: |
          REPO=${GITHUB_REPOSITORY#*/}
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO/${DEPLOY_PATH}"
          echo "$BASE/html/kms.html"
          echo "$BASE/html/qkd.html"
          echo "$BASE/pdf/kms.pdf"
          echo "$BASE/pdf/qkd.pdf"
