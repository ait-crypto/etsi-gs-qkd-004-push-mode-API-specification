name: Generate OpenAPI Docs

on:
  push:
    paths:
      - etsi_004_push_mode_kms_server.yaml
      - etsi_004_push_mode_qkd_server.yaml
      - .github/workflows/openapi-docs.yml
      - docs/rapipdf_config.json
  workflow_dispatch:

jobs:
  html-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly
        run: npm install -g @redocly/cli

      - name: Generate HTML
        run: |
          mkdir -p docs
          redocly build-docs etsi_004_push_mode_kms_server.yaml -o docs/kms.html
          redocly build-docs etsi_004_push_mode_qkd_server.yaml -o docs/qkd.html

      - name: Commit HTML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/*.html
          git commit -m "Auto-generate HTML OpenAPI docs" || true
          git push

      - name: Compute safe branch name
        run: echo "SAFE_BRANCH=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Deploy HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.SAFE_BRANCH }}
          exclude_assets: '**/*.pdf'

      - name: Print GitHub Pages URLs
        run: |
          REPO=${GITHUB_REPOSITORY#*/}
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO/${SAFE_BRANCH}"
          echo "$BASE/kms.html"
          echo "$BASE/qkd.html"

  pdf-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rapipdf CLI
        run: |
          npm install -g @kingjan1999/rapipdf-cli
          fc-list | grep -i ubuntu
          fc-list

      - name: Generate PDFs
        run: |
          mkdir -p docs
          rapipdf etsi_004_push_mode_kms_server.yaml -o docs/kms.pdf -c docs/rapipdf_config.json
          rapipdf etsi_004_push_mode_qkd_server.yaml -o docs/qkd.pdf -c docs/rapipdf_config.json

      - name: Commit PDFs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/*.pdf
          git commit -m "Auto-generate PDF OpenAPI docs" || true
          git push
